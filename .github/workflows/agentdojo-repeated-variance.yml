    branches:
      - main
    paths:
      - .github/workflows/agentdojo-repeated-variance.yml

permissions:
  contents: read

concurrency:
  group: agentdojo-repeated-variance
  cancel-in-progress: true

jobs:
  superseded:
    runs-on: ubuntu-latest
    steps:
      - name: Stop duplicate study
        run: echo "Superseded by completed repeated-trials run 35167246091."
