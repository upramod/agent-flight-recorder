name: USENIX paper build

on:
  push:
    branches: [main]
    paths:
      - paper/usenix-security-2027.tex
      - paper/usenix2019_v3.sty
      - paper/references.bib
      - .github/workflows/usenix-paper-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify vendored USENIX style
        run: test -s paper/usenix2019_v3.sty
      - name: Compile anonymous manuscript
        uses: xu-cheng/latex-action@v4
        with:
          root_file: usenix-security-2027.tex
          working_directory: paper
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Check PDF and anonymity metadata
        shell: bash
        run: |
          test -s paper/usenix-security-2027.pdf
          strings paper/usenix-security-2027.pdf | grep -E -i 'Pramod|Ubbala|upramod' && exit 1 || true
          pages=$(pdfinfo paper/usenix-security-2027.pdf | awk '/^Pages:/ {print $2}')
          echo "Compiled pages: $pages"
          test "$pages" -le 15
      - name: Upload compiled draft
        uses: actions/upload-artifact@v7
        with:
          name: usenix-security-2027-draft-${{ github.run_id }}
          path: paper/usenix-security-2027.pdf
          retention-days: 30
