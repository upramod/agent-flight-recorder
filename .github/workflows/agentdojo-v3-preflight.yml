name: AgentDojo v3 model preflight
on:
  push:
    branches: [experiment/isdfs-107-v3]
    paths: [.github/workflows/agentdojo-v3-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION || '2025-01-01-preview' }}
      AZURE_OPENAI_SECONDARY_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_SECONDARY_DEPLOYMENT || vars.AZURE_OPENAI_SECONDARY_DEPLOYMENT }}
      AZURE_OPENAI_SECONDARY_ENDPOINT: ${{ secrets.AZURE_OPENAI_SECONDARY_ENDPOINT }}
      AZURE_OPENAI_SECONDARY_API_KEY: ${{ secrets.AZURE_OPENAI_SECONDARY_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_SECONDARY_MODEL: ${{ vars.OPENAI_SECONDARY_MODEL || 'gpt-4o-2024-08-06' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'openai==3.26.0'
      - name: Probe model identity and compatibility
        run: python integrations/agentdojo/model_preflight.py --output results/v3-model-preflight.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v3-model-preflight-${{ github.run_id }}
          path: results/v3-model-preflight.json
          retention-days: 90
