name: AgentDojo v3 reviewer validation
on:
  push:
    branches: [experiment/isdfs-107-v3]
    paths: [.github/workflows/agentdojo-v3-validation.yml]
  workflow_dispatch:
permissions:
  contents: read
env:
  AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
  AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
  AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
  AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION || '2025-01-01-preview' }}
  AZURE_OPENAI_SECONDARY_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_SECONDARY_DEPLOYMENT || vars.AZURE_OPENAI_SECONDARY_DEPLOYMENT }}
  AZURE_OPENAI_SECONDARY_ENDPOINT: ${{ secrets.AZURE_OPENAI_SECONDARY_ENDPOINT }}
  AZURE_OPENAI_SECONDARY_API_KEY: ${{ secrets.AZURE_OPENAI_SECONDARY_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_SECONDARY_MODEL: ${{ vars.OPENAI_SECONDARY_MODEL || 'gpt-4o-2024-08-06' }}
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci && npm test
      - run: python -m pip install -r integrations/agentdojo/requirements-validation.txt
      - run: python -m unittest discover -s integrations/agentdojo -p 'test_*.py'
      - name: Verify manifest reproduction
        run: |
          python integrations/agentdojo/generate_v3_manifest.py /tmp/manifest.json
          cmp /tmp/manifest.json integrations/agentdojo/reviewer-validation-manifest-v3.json
      - name: Bind available models
        run: python integrations/agentdojo/model_preflight.py --output results/preflight.json
      - name: Development cases only
        run: |
          for workload in fixed clean adaptive; do
            STUDY_TOKEN_LEDGER="$PWD/results/usage-$workload.jsonl" python integrations/agentdojo/run_validation_v3.py --manifest integrations/agentdojo/reviewer-validation-manifest-v3.json --preflight results/preflight.json --output "results/development-$workload" --model-slot model-a --workload "$workload" --development --limit 1 --max-attempts 2
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v3-development-${{ github.run_id }}
          path: results/
          retention-days: 90
