name: AgentDojo v3 additional model discovery
on:
  push:
    branches: [experiment/isdfs-107-v3]
    paths: [.github/workflows/agentdojo-v3-secondary-discovery.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION || '2025-01-01-preview' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'openai==3.26.0'
      - name: Probe other returned model-family IDs
        run: |
          PYTHONPATH=integrations/agentdojo python - <<'PY'
          import json, pathlib
          from model_preflight import probe_one
          # Both IDs were returned by the resource model listing in run37549220926.
          names = ['gpt-4.1', 'gpt-4o-mini']
          rows = [probe_one({'slot':'model-b','provider':'azure','deployment':name,
                  'endpointEnv':'AZURE_OPENAI_ENDPOINT','keyEnv':'AZURE_OPENAI_API_KEY'}) for name in names]
          result = {'sourceModelListingRun':37549220926,'models':rows,
                    'purpose':'Two bounded connectivity probes; no benchmark outcomes or deployment creation.'}
          pathlib.Path('secondary-discovery.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v3-secondary-discovery-${{ github.run_id }}
          path: secondary-discovery.json
          retention-days: 90
